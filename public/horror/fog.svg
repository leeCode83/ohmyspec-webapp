<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <!-- Lapis fog: bentuk blob blur lebar, dipakai berulang 3x dengan
       kecepatan/opacity/ukuran berbeda (parallax via CSS animation). -->
