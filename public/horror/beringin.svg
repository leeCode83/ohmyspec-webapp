<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMax meet">
  <!-- Pohon beringin siluet — latar horizon hero. Kanopi tidak lagi
       ellipse polos: tepinya bergerigi seperti dedaunan, dengan celah
       cahaya bulan di antara rumpun, plus akar gantung khas beringin.
       fill="currentColor". -->
  <g fill="currentColor">
    <!-- kanopi: satu path bergerigi, bukan ellipse -->
    <path d="
      M300 6
      C360 4 410 14 440 40 C430 34 424 46 432 52 C450 48 470 58 478 76
      C466 72 458 82 466 90 C490 90 508 104 514 126
      C498 120 488 130 496 140 C520 144 540 160 548 184
      C528 176 516 186 524 198 C544 204 560 220 566 242
      C548 236 536 244 542 256 C556 262 568 274 576 290
      L20 290
      C30 274 44 262 60 256 C56 244 44 236 26 242
      C32 220 48 204 70 198 C66 186 54 176 34 184
      C42 160 62 144 86 140 C80 130 70 120 54 126
      C60 104 78 90 102 90 C96 82 88 72 76 76
      C84 58 104 48 122 52 C114 46 108 34 98 40
      C128 14 180 4 240 6
      C262 2 280 2 300 6 Z"/>
    <!-- batang -->
    <path d="M282 210 L272 400 L328 400 L318 210 Z"/>
    <!-- akar pijak di tanah -->
    <path d="M250 390 C240 380 220 376 200 380 L204 396 L262 396 Z"/>
    <path d="M350 390 C360 380 380 376 400 380 L396 396 L338 396 Z"/>
  </g>
  <!-- celah cahaya bulan antar rumpun (di luar grup agar tidak ter-tint) -->
  <g fill="#02070c" opacity="0.9">
    <ellipse cx="170" cy="86" rx="22" ry="12" transform="rotate(-18 170 86)"/>
    <ellipse cx="300" cy="58" rx="16" ry="9"/>
    <ellipse cx="430" cy="96" rx="24" ry="11" transform="rotate(14 430 96)"/>
    <ellipse cx="80" cy="196" rx="18" ry="9" transform="rotate(-12 80 196)"/>
    <ellipse cx="520" cy="206" rx="20" ry="9" transform="rotate(10 520 206)"/>
  </g>
  <!-- cabang -->
  <g fill="currentColor">
    <path d="M286 240 C240 230 200 236 160 258 L164 266 C204 246 242 242 288 252 Z"/>
    <path d="M314 240 C360 230 400 236 440 258 L436 266 C396 246 358 242 312 252 Z"/>
    <!-- panikel / akar gantung khas beringin -->
    <g opacity="0.9">
      <rect x="180" y="200" width="4" height="150" rx="2"/>
      <rect x="230" y="190" width="3" height="180" rx="1.5"/>
      <rect x="370" y="190" width="4" height="160" rx="2"/>
      <rect x="420" y="200" width="3" height="140" rx="1.5"/>
      <rect x="120" y="210" width="3" height="120" rx="1.5"/>
      <rect x="480" y="210" width="4" height="130" rx="2"/>
      <rect x="300" y="205" width="3" height="150" rx="1.5"/>
    </g>
  </g>
</svg>
