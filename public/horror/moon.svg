<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bulan purnama poster: sumber cahaya utama hero. Permukaan bertekstur
       (kawah, maria, gradasi tepi), bukan lingkaran + tiga titik. -->
  <defs>
    <radialGradient id="moon-face" cx="40%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="55%" stop-color="#f1e6cc"/>
      <stop offset="88%" stop-color="#d8c7a2"/>
      <stop offset="100%" stop-color="#bda984"/>
    </radialGradient>
    <radialGradient id="moon-shade" cx="64%" cy="66%" r="70%">
      <stop offset="0%" stop-color="#8f7d5e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8f7d5e" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="moon-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#moon-face)"/>
  <!-- Maria: daerah gelap halus -->
  <g fill="#cbb893" opacity="0.55">
    <ellipse cx="70" cy="70" rx="26" ry="19" transform="rotate(-20 70 70)"/>
    <ellipse cx="132" cy="104" rx="20" ry="15" transform="rotate(15 132 104)"/>
    <ellipse cx="84" cy="138" rx="15" ry="11"/>
    <ellipse cx="122" cy="46" rx="12" ry="9"/>
  </g>
  <!-- Kawah: cincin + bayangan tepi -->
  <g fill="#b8a37c" opacity="0.65">
    <circle cx="58" cy="106" r="7"/>
    <circle cx="104" cy="82" r="5"/>
    <circle cx="146" cy="132" r="6"/>
    <circle cx="96" cy="160" r="4"/>
    <circle cx="150" cy="70" r="3.5"/>
    <circle cx="44" cy="60" r="4"/>
  </g>
  <g fill="none" stroke="#f6eedb" stroke-opacity="0.5" stroke-width="1.2">
    <circle cx="58" cy="106" r="7"/>
    <circle cx="104" cy="82" r="5"/>
    <circle cx="146" cy="132" r="6"/>
  </g>
  <!-- Bayangan sisi kanan bawah + tekstrur -->
  <circle cx="100" cy="100" r="92" fill="url(#moon-shade)"/>
  <circle cx="100" cy="100" r="92" fill="#ffffff" filter="url(#moon-grain)" opacity="0.5"/>
</svg>
