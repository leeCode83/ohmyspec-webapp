<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bulan purnama dengan kawah samar — sumber cahaya utama hero.
       Glow ditambahkan via CSS box-shadow/filter di pemakaian. -->
  <defs>
    <radialGradient id="moon-face" cx="42%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="70%" stop-color="#efe4c8"/>
      <stop offset="100%" stop-color="#d9c9a3"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="88" fill="url(#moon-face)"/>
  <!-- kawah samar -->
  <g fill="#d9c9a3" opacity="0.5">
    <ellipse cx="72" cy="66" rx="14" ry="11"/>
    <ellipse cx="128" cy="96" rx="18" ry="14"/>
    <ellipse cx="86" cy="132" rx="10" ry="8"/>
    <ellipse cx="118" cy="52" rx="7" ry="6"/>
    <ellipse cx="60" cy="106" rx="6" ry="5"/>
  </g>
</svg>
