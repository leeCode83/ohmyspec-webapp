       bungkuk, rambut lepas, lengan menjulur memeluk. fill="currentColor". -->
  <g fill="currentColor">
    <!-- rambut wild ke atas (menyeramkan tapi kartun) -->
    <path d="M110 20 C86 20 70 38 68 62 C66 82 72 96 84 104 C80 88 82 74 88 64 C90 78 96 88 104 92 C102 78 106 66 112 60 C118 66 122 78 120 92 C128 88 134 78 136 64 C142 74 144 88 140 104 C152 96 158 82 156 62 C154 38 134 20 110 20 Z"/>
    <!-- tubuh bungkuk -->
    <path d="M86 100 C70 120 60 150 60 186 C60 226 74 256 100 268 L130 268 C150 254 160 226 160 190 C160 154 150 124 134 104 Z"/>
    <!-- lengan menjulur ke depan (mengadopsi) -->
    <path d="M64 150 C46 164 32 180 24 196 C20 204 28 210 34 204 C44 190 58 176 72 166 Z"/>
    <path d="M156 150 C174 164 188 180 196 196 C200 204 192 210 186 204 C176 190 162 176 148 166 Z"/>
    <!-- gaun berlipat turun -->
    <path d="M92 240 C90 258 90 276 94 292 L128 292 C132 276 132 258 130 240 Z" opacity="0.6"/>
  </g>
</svg>
