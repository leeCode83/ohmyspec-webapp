<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720">
  <!-- Kuntilanak — cut-out poster untuk hero. Dua nada: ink gelap + rim
       cahaya bulan, rambut berhelai, gaun mengalir dengan lipatan, rentang
       tangan. Elemen <g id="eye"> bisa dicahayai via CSS. -->
  <defs>
    <linearGradient id="k-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2533"/>
      <stop offset="55%" stop-color="#0e1721"/>
      <stop offset="100%" stop-color="#070c12"/>
    </linearGradient>
    <linearGradient id="k-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b44a" stop-opacity="0"/>
      <stop offset="45%" stop-color="#f0d79b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f0d79b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8b44a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="k-veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7dcc6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#e7dcc6" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- ===== Gaun: siluet mengalir ke lantai ===== -->
  <path fill="url(#k-fill)" d="
    M210 300
    C182 300 168 330 164 372
    C160 412 150 452 136 500
    C122 548 108 600 96 650
    C90 676 86 698 82 712
    L338 712
    C334 698 330 676 324 650
    C312 600 298 548 284 500
    C270 452 260 412 256 372
    C252 330 238 300 210 300 Z"/>
  <!-- Lipatan & rim light di sisi kiri gaun -->
  <path fill="none" stroke="url(#k-veil)" stroke-width="3" stroke-linecap="round" d="
    M206 320 C200 400 190 480 172 560 C160 610 150 660 144 706"/>
  <path fill="none" stroke="url(#k-veil)" stroke-width="2" stroke-linecap="round" d="
    M222 330 C222 420 228 520 240 620 C246 660 250 686 254 710"/>
  <path fill="none" stroke="url(#k-rim)" stroke-width="4" stroke-linecap="round" d="
    M164 372 C158 430 140 520 118 610"/>

  <!-- ===== Lengan terkulai panjang ===== -->
  <path fill="url(#k-fill)" d="
    M168 356 C142 372 116 404 98 448 C92 464 88 482 90 496
    C96 498 102 490 106 480 C120 446 142 414 172 388 Z"/>
  <path fill="url(#k-fill)" d="
    M252 356 C278 372 304 404 322 448 C328 464 332 482 330 496
    C324 498 318 490 314 480 C300 446 278 414 248 388 Z"/>
  <!-- Tangan menggantung: jari tipis -->
  <g fill="url(#k-fill)">
    <path d="M96 488 C92 506 90 522 92 536 C94 540 98 538 98 534 L100 512 Z"/>
    <path d="M102 490 C100 508 100 524 104 538 C106 542 110 540 110 536 L108 512 Z"/>
    <path d="M324 488 C328 506 330 522 328 536 C326 540 322 538 322 534 L320 512 Z"/>
    <path d="M318 490 C320 508 320 524 316 538 C314 542 310 540 310 536 L312 512 Z"/>
  </g>

  <!-- ===== Kepala + rambut panjang ===== -->
  <path fill="url(#k-fill)" d="
    M210 40
    C176 40 154 66 152 104
    C150 138 146 176 140 214
    C134 254 126 292 120 330
    C118 344 124 352 132 352
    L286 352
    C296 352 302 344 300 330
    C294 292 286 254 280 214
    C274 176 270 138 268 104
    C266 66 244 40 210 40 Z"/>
  <!-- Helai rambut: goresan tipis di atas siluet -->
  <g fill="none" stroke="url(#k-veil)" stroke-width="1.6" stroke-linecap="round">
    <path d="M176 70 C168 130 160 210 150 300"/>
    <path d="M192 58 C186 130 180 230 170 330"/>
    <path d="M210 52 L206 340"/>
    <path d="M228 56 C230 140 234 250 240 330"/>
    <path d="M246 66 C252 140 260 230 268 320"/>
    <path d="M158 96 C152 170 142 250 134 336"/>
    <path d="M262 92 C268 170 276 250 284 336"/>
  </g>
  <!-- Rim line di tepi kiri kepala (cahaya dari bulan kiri atas) -->
  <path fill="none" stroke="url(#k-rim)" stroke-width="3" stroke-linecap="round" d="
    M152 104 C150 150 144 210 132 290"/>

  <!-- ===== Wajah: lubang gelap, dua mata ===== -->
  <ellipse cx="210" cy="118" rx="34" ry="42" fill="#05090d"/>
  <g id="eye" fill="#b03a3a">
    <ellipse cx="197" cy="112" rx="4.5" ry="3"/>
    <ellipse cx="223" cy="112" rx="4.5" ry="3"/>
  </g>

  <!-- ===== Veil tipis di bawah pinggang, terangkat angin ===== -->
  <path fill="url(#k-veil)" d="
    M140 470 C120 520 100 570 84 620 C110 604 136 590 152 570
    C160 548 160 510 156 470 Z" opacity="0.55"/>
</svg>
