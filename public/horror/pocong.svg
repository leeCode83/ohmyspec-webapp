<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <!-- Pocong — spec yang terikat janji, tak bisa istirahat. Kain kafan
       membungkus, simpul tali di atas kepala. fill="currentColor". -->
  <g fill="currentColor">
    <!-- badan kafan: kapsul membulat -->
    <path d="M100 30 C64 30 44 60 44 100 L44 220 C44 260 64 280 100 280 C136 280 156 260 156 220 L156 100 C156 60 136 30 100 30 Z"/>
    <!-- wajah gelap di dalam kafan (lubang) -->
    <ellipse cx="100" cy="82" rx="26" ry="30" fill="#0B141E"/>
    <!-- simpul tali di mahkota kepala -->
    <path d="M92 24 C90 14 96 8 100 6 C104 8 110 14 108 24 L104 34 L96 34 Z"/>
    <!-- ikatan tali horizontal -->
    <rect x="44" y="118" width="112" height="6" rx="3" fill="#0B141E" opacity="0.55"/>
    <rect x="44" y="170" width="112" height="6" rx="3" fill="#0B141E" opacity="0.55"/>
    <rect x="44" y="222" width="112" height="6" rx="3" fill="#0B141E" opacity="0.55"/>
    <!-- tali vertikal simpul -->
    <rect x="96" y="30" width="8" height="250" rx="4" fill="#0B141E" opacity="0.55"/>
  </g>
</svg>
